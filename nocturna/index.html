<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Campaña Oficial - Rueda Libre</title>
    <!-- Enlace al CSS compilado por la CLI -->
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-between">

    <!-- Sección principal de campaña -->
    <main class="w-full px-6 py-16 md:py-24">
        <section class="w-full max-w-4xl mx-auto bg-slate-900 p-8 md:p-14 rounded-3xl space-y-8 shadow-2xl">

            <!-- Etiqueta de campaña -->
            <div>
                <span
                    class="inline-block bg-amber-400 text-slate-950 text-xs font-extrabold uppercase tracking-widest px-4 py-1.5 rounded-full shadow-sm">
                    Nuevo · Jueves a sábado.
                </span>
            </div>

            <!-- Título único y subtítulo -->
            <div class="space-y-4">
                <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight leading-tight">
                    Rueda Nocturna.
                </h1>
                <p class="max-w-2xl text-lg md:text-xl text-slate-300 font-normal leading-relaxed">
                    Descubre Medellín en bici cuando se encienden las luces.
                </p>
            </div>

            <!-- Datos destacados -->
            <div class="w-full max-w-md bg-slate-800/80 p-6 rounded-2xl space-y-4 border border-slate-700/50">
                <div class="space-y-1">
                    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">
                        Recorridos disponibles.
                    </p>
                    <p class="text-2xl font-bold text-white leading-snug">
                        3 rutas.
                    </p>
                </div>

                <div class="pt-4 border-t border-slate-700 space-y-1">
                    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">
                        Tarifa de lanzamiento.
                    </p>
                    <p class="text-2xl font-bold text-amber-400 leading-snug">
                        Desde $55.000.
                    </p>
                </div>
            </div>

            <!-- COMPONENTES DE BOTÓN (Principal, Secundario y de Contorno con estados hover y focus) -->
            <div class="pt-4 flex flex-wrap items-center gap-4">

                <!-- 1. Botón Principal -->
                <a href="../paginas/reservas.html"
                    class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white text-base font-bold uppercase tracking-wide px-8 py-4 rounded-xl shadow-lg focus:outline-none focus:ring-4 focus:ring-emerald-400/50 transition-all">
                    Inscríbete.
                </a>

                <!-- 2. Botón Secundario -->
                <a href="#detalles"
                    class="inline-block bg-slate-800 hover:bg-slate-700 text-slate-100 text-base font-semibold tracking-wide px-6 py-4 rounded-xl shadow-md focus:outline-none focus:ring-4 focus:ring-slate-400/50 transition-all">
                    Ver detalles.
                </a>

                <!-- 3. Botón de Contorno (Outline) -->
                <a href="../index.html"
                    class="inline-block bg-transparent hover:bg-slate-800 text-emerald-400 border-2 border-emerald-500 text-base font-semibold tracking-wide px-6 py-3.5 rounded-xl focus:outline-none focus:ring-4 focus:ring-emerald-400/50 transition-all">
                    Volver al inicio.
                </a>

            </div>

        </section>
    </main>

    <footer class="text-center py-6 text-xs text-slate-500">
        Rueda Libre © 2026 · Campaña Rueda Nocturna
    </footer>

</body>

</html>
