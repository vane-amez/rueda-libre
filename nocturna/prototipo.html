<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Prototipo de Campaña - Rueda Libre</title>
    <!-- Play CDN de Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

    <!-- Sección principal (Hero de campaña) -->
    <main class="w-full px-6 py-16 md:py-24">
        <section class="w-full max-w-4xl mx-auto bg-slate-900 p-8 md:p-14 rounded-3xl space-y-8 shadow-2xl">

            <!-- 1. Etiqueta de campaña -->
            <div>
                <span
                    class="inline-block bg-amber-400 text-slate-950 text-xs font-extrabold uppercase tracking-widest px-4 py-1.5 rounded-full">
                    Nuevo · Jueves a sábado.
                </span>
            </div>

            <!-- 2. Título único (h1) y subtítulo -->
            <div class="space-y-4">
                <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight leading-tight">
                    Rueda Nocturna.
                </h1>
                <p class="max-w-2xl text-lg md:text-xl text-slate-300 font-normal leading-relaxed">
                    Descubre Medellín en bici cuando se encienden las luces.
                </p>
            </div>

            <!-- 3. Dos datos destacados -->
            <div class="w-full max-w-md bg-slate-800/80 p-6 rounded-2xl space-y-4">
                <div class="space-y-1">
                    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">
                        Recorridos disponibles.
                    </p>
                    <p class="text-2xl font-bold text-white leading-snug">
                        3 rutas.
                    </p>
                </div>

                <div class="pt-4 border-t border-slate-700 space-y-1">
                    <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">
                        Tarifa de lanzamiento.
                    </p>
                    <p class="text-2xl font-bold text-amber-400 leading-snug">
                        Desde $55.000.
                    </p>
                </div>
            </div>

            <!-- 4. Enlace con apariencia de botón -->
            <div class="pt-2">
                <a href="../paginas/reservas.html"
                    class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white text-base font-bold uppercase tracking-wide px-8 py-4 rounded-xl shadow-lg">
                    Inscríbete.
                </a>
            </div>

        </section>
    </main>

</body>

</html>
